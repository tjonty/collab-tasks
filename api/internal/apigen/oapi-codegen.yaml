# Generates api.gen.go from contract/openapi.yaml. Run `go generate ./...`
# from api/ after changing the contract; the output is committed.
package: apigen
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  # Keep schemas no path references, such as the WebSocket messages.
  skip-prune: true
