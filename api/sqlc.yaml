# Generates api/internal/store from the migrations (schema) and db/queries.
# Run `sqlc generate` from api/ after changing either; the output is committed.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
